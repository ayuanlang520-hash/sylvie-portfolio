name: 发布个人网站
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'lib/**'
      - 'scripts/**'
      - '*.css'
      - 'script.js'
      - 'eleventy.config.js'
      - 'package*.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS context
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
  history:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 保存成功发布的历史版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/version-history.mjs published "$GITHUB_SHA"
