name: 恢复网站内容
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS context
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: content-version-operations
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 恢复内容并保留恢复前版本
        env:
          CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/content-versions.mjs restore --push
