media:
  - name: assets
    label: 图片与附件
    input: assets
    output: /assets
content:
  - name: version_history
    label: 历史版本与回退
    type: collection
    path: history/versions
    format: json
    filename:
      template: '{snapshot}.json'
      field: false
    subfolders: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, kind, description, createdAt]
      sort: [createdAt]
      default:
        sort: createdAt
        order: desc
    fields:
      - name: title
        label: 版本时间与类型
        type: string
        readonly: true
        description: 时间按 UTC+8 显示。点击页面上方“恢复这个版本并发布”可回到此版本。
      - name: kind
        label: 版本类型
        type: string
        readonly: true
      - name: description
        label: 版本说明
        type: text
        readonly: true
      - name: createdAt
        label: 记录时间（UTC）
        type: string
        readonly: true
      - name: snapshot
        label: 内容版本编号（自动记录）
        type: string
        readonly: true
    actions:
      - name: restore-history-version
        label: 恢复这个版本并发布
        scope: entry
        workflow: restore.yml
        ref: main
        cancelable: false
        confirm:
          title: 恢复到这个历史版本？
          message: 会恢复全站文字、作品、板块和素材，并自动检查和发布。恢复前会另留当前内容的安全版本，程序修复会保留。
          button: 确认恢复并发布
  - name: home-sections
    label: 首页板块与导航
    type: file
    path: src/_data/sections.json
    format: json
    operations:
      delete: false
    fields:
      - name: items
        label: 首页板块
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: key
            label: 板块类型
            type: select
            required: true
            options:
              values:
                - name: custom
                  label: 自定义文字板块
                - name: projects
                  label: 已有作品区
                - name: experience
                  label: 北辰学习经历
                - name: more
                  label: 探索方向
                - name: path
                  label: 个人路径
                - name: together
                  label: 合作意愿
                - name: contact
                  label: 联系方式
          - name: id
            label: 自定义板块的网址名称
            type: string
            description: 仅自定义板块需要填写：使用小写字母、数字或短横线，创建后保持不变。
          - name: title
            label: 板块名称
            type: string
            required: true
            description: 自定义板块用作页面标题；已有板块用作管理名称，页面标题在对应内容表单中修改。
          - name: navigationLabel
            label: 导航文字
            type: string
            description: 留空时使用板块名称。
          - name: visible
            label: 显示这个板块
            type: boolean
            default: true
          - name: inNavigation
            label: 加入首页导航
            type: boolean
            default: true
          - name: body
            label: 自定义板块正文
            type: rich-text
            options:
              format: markdown
              media: assets
