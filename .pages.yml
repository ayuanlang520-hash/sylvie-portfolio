actions:
  - name: check-content
    label: 检查并生成预览（不发布）
    workflow: check.yml
    ref: main
    confirm:
      title: 检查已保存的内容？
      message: 检查文字、链接和页面能否生成，并提供可下载预览。不会修改公开网站。
      button: 开始检查
  - name: publish-site
    label: 重新发布当前内容
    workflow: publish.yml
    ref: main
    confirm:
      title: 发布这些修改？
      message: 保存内容已会自动发布。此按钮可手动重新运行发布；检查失败时仍保留上一次成功的公开页面。
      button: 重新发布
  - name: backup-content
    label: 创建备份
    workflow: backup.yml
    ref: main
    confirm:
      title: 创建一次内容备份？
      message: 保留当前已保存的内容版本，并生成可下载的源文件压缩包。不会发布网站。
      button: 创建备份
  - name: restore-content
    label: 按备份编号恢复（高级）
    workflow: restore.yml
    ref: main
    confirm:
      title: 从备份恢复内容？
      message: 会覆盖已保存的文字、作品、板块和图片，随后自动检查和发布。恢复前会另存当前版本；通常可直接在“历史版本与回退”选择记录恢复。
      button: 恢复内容
    fields:
      - name: version
        label: 备份版本（留空使用最近一次）
        type: text
        required: false
settings:
  content:
    merge: true
